name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libncursesw5-dev ccache

      - name: Build
        run: make build

      - name: Test
        run: make test
