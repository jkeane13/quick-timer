name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} --generate-notes || true

  build-release:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-release
            script: scripts/linux-release.sh
            artifact: timer-linux-x86_64.tar.gz
          - os: windows-latest
            target: windows-release
            script: scripts/windows-release.bat
            artifact: timer-windows.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make clean && make ${{ matrix.target }}

      - name: Create release artifact
        shell: ${{ matrix.os == 'windows-latest' && 'cmd' || 'bash' }}
        run: ${{ matrix.script }}

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} ${{ matrix.artifact }} --clobber
